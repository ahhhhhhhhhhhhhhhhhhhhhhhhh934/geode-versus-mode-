name: Unit tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host unit tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.cpp; do
            echo "::group::Building $test"
            g++ -std=c++20 -Wall -Wextra -Werror -Isrc "$test" -o "/tmp/$(basename "$test" .cpp)"
            echo "::endgroup::"
          done
          for test in tests/test_*.cpp; do
            name="$(basename "$test" .cpp)"
            echo "::group::Running $name"
            "/tmp/$name"
            echo "::endgroup::"
          done
