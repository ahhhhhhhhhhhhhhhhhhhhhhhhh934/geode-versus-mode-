# Re-triggered after GitHub Actions runner-assignment incident on 2026-11-11.
name: Build Android Geode mod

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build-android64:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.bump.outputs.commit }}
      release: ${{ steps.bump.outputs.release }}
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || (github.ref_type == 'tag' && github.event.repository.default_branch) || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Prepare release version
        id: bump
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          CURRENT="$(jq -r '.version' mod.json)"
          if [[ ! "$CURRENT" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Invalid mod.json version: $CURRENT"
            exit 1
          fi

          VERSION_PARTS="${CURRENT#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_PARTS"
          CMAKE_CURRENT="$(awk '/^project[(]/ { for (i=1;i<=NF;i++) if ($i=="VERSION") { sub(/\)/,"",$(i+1)); print $(i+1); exit}}' CMakeLists.txt)"
          if [[ "$CMAKE_CURRENT" != "$MAJOR.$MINOR.$PATCH" ]]; then
            echo "::error::Version mismatch: mod.json=$CURRENT, CMake=$CMAKE_CURRENT"
            exit 1
          fi

          # PR and feature-branch runs validate/build only. Releases are made
          # only from the default branch, tags, or an explicit manual run.
          #
          # Feature-branch and PR builds must never create or publish a release,
          # but they must still run the Android build and upload the artifact.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            NEXT="$CURRENT"
            RELEASE_TARGET="$GITHUB_SHA"
            RELEASE="false"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            NEXT="$GITHUB_REF_NAME"
            RELEASE_TARGET="$GITHUB_SHA"
            RELEASE="true"
          elif [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            NEXT="$CURRENT"
            RELEASE_TARGET="$GITHUB_SHA"
            RELEASE="false"
          else
            PATCH=$((PATCH + 1))
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
            jq --arg version "$NEXT" '.version = $version' mod.json > mod.json.tmp
            mv mod.json.tmp mod.json
            sed -i "s/VERSION $MAJOR.$MINOR.$((PATCH - 1))/VERSION $MAJOR.$MINOR.$PATCH/" CMakeLists.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mod.json CMakeLists.txt
            git commit -m "chore: bump release version to $NEXT [skip ci]"
            RELEASE_TARGET="$(git rev-parse HEAD)"
            git push origin "HEAD:$GITHUB_REF_NAME"
            RELEASE="true"
          fi

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_TARGET" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Prepared version $NEXT"

      - name: Validate release version
        shell: bash
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then VERSION="$REF_NAME"; fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi

      - name: Build Android64 Geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          path: .
          build-config: Release
          android-min-sdk: '24'

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: Versus-Mode-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 90

  publish-release:
    # Never publish unless the Android package build completed successfully,
    # the release gate was explicitly requested, and this is not a PR run.
    if: needs.build-android64.result == 'success' && needs.build-android64.outputs.release == 'true' && github.event_name != 'pull_request' 
    needs: [build-android64]
    runs-on: ubuntu-latest
    steps:
      - name: Validate bumped release version
        id: version
        shell: bash
        env:
          VERSION: ${{ needs.build-android64.outputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Android package
        uses: actions/download-artifact@v4
        with:
          name: Versus-Mode-Android64
          path: release-assets/android

      - name: Publish verified Android release
        uses: softprops/action-gh-release@v2
        with:
          name: Versus Mode ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ needs.build-android64.outputs.commit }}
          generate_release_notes: true
          files: release-assets/**/*.geode
          fail_on_unmatched_files: true
          make_latest: true
