name: Build Android Geode mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Android64 Geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: '5.8.2'
          target: Android64
          path: .
          build-config: Release
          android-min-sdk: '24'

      - name: Upload installable Geode package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Versus-Mode-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Versus Mode ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.build-output }}
          fail_on_unmatched_files: true
          make_latest: true
