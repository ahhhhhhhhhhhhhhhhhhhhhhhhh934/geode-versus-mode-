name: Versus Mode CI and Releases
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
permissions:
  contents: write
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host unit tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test_*.cpp; do
            g++ -std=c++20 -Wall -Wextra -Werror -Isrc "$test" -o "/tmp/$(basename "$test" .cpp)"
          done
          for test in tests/test_*.cpp; do
            name="$(basename "$test" .cpp)"
            "/tmp/$name"
          done
  build:
    needs: host-tests
    name: GD ${{ matrix.gd }} / Geode ${{ matrix.sdk }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gd: "2.2081", sdk: "5.11.2", target: Android64, runner: ubuntu-latest, artifact: Versus-Mode-GD-2.2081-Android64 }
          - { gd: "2.2081", sdk: "5.11.2", target: iOS, runner: macos-latest, artifact: Versus-Mode-GD-2.2081-iOS }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || (github.ref_type == 'tag' && github.event.repository.default_branch) || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate target metadata
        env:
          GD_VERSION: ${{ matrix.gd }}
          GEODE_VERSION: ${{ matrix.sdk }}
        run: |
          set -euo pipefail
          jq --arg gd "$GD_VERSION" --arg geode "$GEODE_VERSION" '.geode = $geode | .gd.android = $gd | .gd.ios = $gd' mod.json > mod.json.tmp
          mv mod.json.tmp mod.json
      - name: Build Geode package
        id: package
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          path: .
          build-config: Release
          android-min-sdk: "24"
      - name: Verify package
        env:
          OUTPUT: ${{ steps.package.outputs.build-output }}
        run: |
          set -euo pipefail
          find "$OUTPUT" -maxdepth 1 -type f -name '*.geode' -print -quit | grep -q .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.package.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 90
  publish-release:
    if: github.event_name != 'pull_request' && github.ref_type != 'tag' && github.ref_name == github.event.repository.default_branch
    needs: [host-tests, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Prepare release version
        id: version
        run: |
          set -euo pipefail
          CURRENT="$(jq -r '.version' mod.json)"
          [[ "$CURRENT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT#v}"
          CMAKE_CURRENT="$(awk '/^project[(]/ { for (i=1;i<=NF;i++) if ($i=="VERSION") { sub(/\)/,"",$(i+1)); print $(i+1); exit}}' CMakeLists.txt)"
          [[ "$CMAKE_CURRENT" == "$MAJOR.$MINOR.$PATCH" ]]
          PATCH=$((PATCH + 1))
          NEXT="v$MAJOR.$MINOR.$PATCH"
          jq --arg version "$NEXT" '.version = $version' mod.json > mod.json.tmp
          mv mod.json.tmp mod.json
          sed -i "s/VERSION $MAJOR.$MINOR.$((PATCH - 1))/VERSION $MAJOR.$MINOR.$PATCH/" CMakeLists.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mod.json CMakeLists.txt
          git commit -m "chore: bump release version to $NEXT [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: Versus-Mode-*
          path: release-assets
          merge-multiple: false
      - name: Publish all compatibility packages
        uses: softprops/action-gh-release@v2
        with:
          name: Versus Mode ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.version.outputs.commit }}
          generate_release_notes: true
          files: release-assets/**/versus.mode.geode
          fail_on_unmatched_files: true
          make_latest: true
