name: Build Android and iOS Geode mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.version' mod.json)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Android64 Geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: '5.11.1'
          target: Android64
          path: .
          build-config: Release
          android-min-sdk: '24'

      - name: Upload installable Geode package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Versus-Mode-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish or update GitHub Release automatically
        uses: softprops/action-gh-release@v2
        with:
          name: Versus Mode ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: output/*.geode
          fail_on_unmatched_files: true
          make_latest: true

  build-ios:
    runs-on: macos-latest
    needs: build-android64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: echo "version=$(jq -r '.version' mod.json)" >> "$GITHUB_OUTPUT"

      - name: Build iOS Geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: '5.11.1'
          target: iOS
          path: .
          build-config: Release

      - name: Upload iOS Geode package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Versus-Mode-iOS
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 90

      - name: Add iOS package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Versus Mode ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: output/*.geode
          fail_on_unmatched_files: true
