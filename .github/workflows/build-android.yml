name: Build Android Geode mod

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-android64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          VERSION="$(jq -r '.version' mod.json)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then VERSION="${GITHUB_REF_NAME}"; fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Android64 Geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          path: .
          build-config: Release
          android-min-sdk: '24'

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: Versus-Mode-Android64
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
          retention-days: 90

  publish-release:
    # Always create a visible result for this job. Only publish on successful
    # non-PR, non-tag builds; PR validation must never create a GitHub release.
    if: always()
    needs: [build-android64]
    runs-on: ubuntu-latest
    steps:
      - name: Explain why release publishing is not running
        if: github.event_name == 'pull_request' || github.ref_type == 'tag' || needs.build-android64.result != 'success'
        shell: bash
        run: |
          echo "Release publishing job ran, but publishing is disabled for this event or build result."
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref type: $GITHUB_REF_TYPE"
          echo "Android build result: ${{ needs.build-android64.result }}"

      - name: Check out source
        if: github.event_name != 'pull_request' && github.ref_type != 'tag' && needs.build-android64.result == 'success'
        uses: actions/checkout@v4

      - name: Validate matching release versions
        if: github.event_name != 'pull_request' && github.ref_type != 'tag' && needs.build-android64.result == 'success'
        id: version
        shell: bash
        run: |
          MOD_VERSION="$(jq -r '.version' mod.json)"
          CMAKE_VERSION="$(sed -nE 's/^project\(VersusMode VERSION ([0-9]+\.[0-9]+\.[0-9]+)\).*/\1/p' CMakeLists.txt)"
          if [[ ! "$MOD_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid mod.json version: $MOD_VERSION"
            exit 1
          fi
          if [[ "$MOD_VERSION" != "v$CMAKE_VERSION" ]]; then
            echo "Version mismatch: mod.json=$MOD_VERSION, CMake=$CMAKE_VERSION"
            exit 1
          fi
          echo "version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Android package
        if: github.event_name != 'pull_request' && github.ref_type != 'tag' && needs.build-android64.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: Versus-Mode-Android64
          path: release-assets/android

      - name: Publish verified Android release
        if: github.event_name != 'pull_request' && github.ref_type != 'tag' && needs.build-android64.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          name: Versus Mode ${{ steps.version.outputs.version }}
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/**/*.geode
          fail_on_unmatched_files: true
          make_latest: true
