name: Geode compatibility matrix

on:
  workflow_dispatch:
  pull_request:
    branches: ["**"]
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "mod.json"
      - "CMakeLists.txt"
      - ".github/workflows/compatibility-matrix.yml"

permissions:
  contents: read

jobs:
  build:
    name: GD ${{ matrix.gd }} / Geode ${{ matrix.sdk }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gd: "2.2081"
            sdk: "5.11.2"
            target: Android64
            runner: ubuntu-latest
            artifact: versus-mode-gd-2081-android64
          - gd: "2.2081"
            sdk: "5.11.2"
            target: iOS
            runner: macos-latest
            artifact: versus-mode-gd-2081-ios
          - gd: "2.2091"
            sdk: "6.0.0"
            target: Android64
            runner: ubuntu-latest
            artifact: versus-mode-gd-2091-android64
          - gd: "2.2091"
            sdk: "6.0.0"
            target: iOS
            runner: macos-latest
            artifact: versus-mode-gd-2091-ios

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Generate target-specific Geode metadata
        shell: bash
        env:
          GD_VERSION: ${{ matrix.gd }}
          GEODE_VERSION: ${{ matrix.sdk }}
        run: |
          jq --arg gd "$GD_VERSION" --arg geode "$GEODE_VERSION" '
            .geode = $geode |
            .gd.android = $gd |
            .gd.ios = $gd
          ' mod.json > mod.json.tmp
          mv mod.json.tmp mod.json
          echo "Building GD $GD_VERSION with Geode SDK $GEODE_VERSION"

      - name: Build Geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: ${{ matrix.target }}
          path: .
          build-config: Release
          android-min-sdk: "24"

      - name: Verify package exists
        shell: bash
        env:
          OUTPUT: ${{ steps.build.outputs.build-output }}
          GD_VERSION: ${{ matrix.gd }}
          TARGET: ${{ matrix.target }}
        run: |
          PACKAGE="$(find "$OUTPUT" -maxdepth 1 -type f -name '*.geode' -print -quit)"
          if [[ -z "$PACKAGE" ]]; then
            echo "::error::No .geode package was produced for GD $GD_VERSION / $TARGET"
            exit 1
          fi
          echo "Built package: $PACKAGE"

      - name: Upload compatibility package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 30
