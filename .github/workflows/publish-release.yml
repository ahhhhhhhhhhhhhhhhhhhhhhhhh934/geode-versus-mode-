name: Publish Versus Mode v0.6.3

on:
  push:
    branches:
      - "overhaul/season-ranked-plaza"
    paths:
      - ".github/workflows/publish-release.yml"
      - "src/**"
      - "mod.json"
      - "CMakeLists.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Android64 Geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          path: .
          build-config: Release
          android-min-sdk: '24'

      - name: Publish GitHub Release and attach .geode
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.3
          name: Versus Mode v0.6.3
          generate_release_notes: true
          files: build/versus.mode.geode
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
