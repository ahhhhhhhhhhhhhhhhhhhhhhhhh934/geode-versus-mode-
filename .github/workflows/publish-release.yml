name: Publish Versus Mode v0.5.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Android64 Geode package
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64
          path: .
          build-config: Release
          android-min-sdk: '24'

      - name: Publish GitHub Release and attach .geode
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: Versus Mode v0.5.0
          generate_release_notes: true
          files: ${{ steps.build.outputs.build-output }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
